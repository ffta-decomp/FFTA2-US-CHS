<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; worker-src blob:; base-uri 'none'; form-action 'none'">
<title>FFTA2 · BPS Patcher</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; --page: #eef3f4; --card: #fbfdfc; --text: #172e37; --muted: #45616c; --border: #829ba4; --accent: #07566b; --hover: #e0eff2; --error: #a12b21; }
  @media (prefers-color-scheme: dark) { :root { --page: #15262e; --card: #1c313c; --text: #e7f0f2; --muted: #b8d0d6; --border: #7b9ea8; --accent: #006075; --hover: #244a59; --error: #ffb8a9; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--page); color: var(--text); border-top: .35rem solid var(--accent); }
  main { width: min(100% - 2rem, 40rem); margin: clamp(2rem, 8vh, 6rem) auto 2rem; }
  .context { color: var(--muted); font-size: .9rem; font-weight: 650; }
  h1 { margin: .2rem 0 1.3rem; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; letter-spacing: -.02em; }
  .panel { background: var(--card); padding: clamp(1rem, 4vw, 1.6rem); border: 1px solid var(--border); border-radius: .8rem; }
  #drop-zone { border: 2px dashed var(--border); border-radius: .65rem; padding: 1rem; }
  #drop-zone.active { background: var(--hover); border-color: var(--accent); }
  #drop-hint { margin: 0 0 1rem; font-weight: 650; }
  .files { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); }
  .file { display: grid; gap: .25rem; min-width: 0; }
  .filename { overflow-wrap: anywhere; color: var(--muted); font-size: .85rem; }
  .picker { position: relative; justify-self: start; border: 1px solid var(--border); border-radius: .35rem; background: var(--hover); padding: .25rem .6rem; font-size: .9rem; }
  .picker:focus-within { outline: 2px solid var(--text); outline-offset: 3px; }
  .picker input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
  button, .download { border: 0; border-radius: .4rem; padding: .65rem 1rem; color: white; background: var(--accent); font: inherit; font-weight: 650; text-decoration: none; cursor: pointer; }
  button:disabled { color: var(--muted); background: var(--page); cursor: default; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; }
  #status { margin: .9rem 0 0; min-height: 1.5em; overflow-wrap: anywhere; }
  #status.error { color: var(--error); }
  .note { color: var(--muted); font-size: .9rem; margin: .85rem 0 0; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <div class="context">FFTA2 · DraStic</div>
  <h1 id="heading">BPS Patcher</h1>
  <section class="panel" aria-labelledby="heading">
    <div id="drop-zone">
      <p id="drop-hint">Drop your ROM and BPS patch here</p>
      <div class="files">
        <label class="file"><strong id="rom-label">Original ROM (.nds)</strong>
          <span class="picker"><span id="choose-rom" aria-hidden="true">Choose file</span><input id="rom" type="file" accept=".nds" aria-labelledby="rom-label" aria-describedby="rom-name"></span>
          <span class="filename" id="rom-name"></span>
        </label>
        <label class="file"><strong id="patch-label">Patch (.bps)</strong>
          <span class="picker"><span id="choose-patch" aria-hidden="true">Choose file</span><input id="patch" type="file" accept=".bps" aria-labelledby="patch-label" aria-describedby="patch-name"></span>
          <span class="filename" id="patch-name"></span>
        </label>
      </div>
    </div>
    <div class="actions">
      <button id="apply" type="button" disabled>Apply patch</button>
      <a id="download" class="download" hidden>Download ROM</a>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="note" id="note">The DraStic r1 patch requires a clean USA Rev 0 ROM. All files stay on this device.</p>
  </section>
</main>
<script id="patch-worker" type="text/plain">
'use strict';
const maxRomBytes = 512 * 1024 * 1024;
const crcTable = Uint32Array.from({length: 256}, (_, index) => {
  let value = index;
  for (let bit = 0; bit < 8; bit++) value = (value >>> 1) ^ (value & 1 ? 0xedb88320 : 0);
  return value;
});

function crc32(bytes) {
  let crc = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xff];
  return (crc ^ 0xffffffff) >>> 0;
}

// BPS1 format by byuu. SourceRead uses the output cursor and does not advance SourceCopy's cursor.
function applyBps(source, patch) {
  if (patch.length < 19 || patch[0] !== 66 || patch[1] !== 80 || patch[2] !== 83 || patch[3] !== 49) {
    throw new Error('format');
  }
  const end = patch.length - 12;
  const footer = new DataView(patch.buffer, patch.byteOffset + end, 12);
  if (crc32(patch.subarray(0, end + 8)) !== footer.getUint32(8, true)) throw new Error('patchChecksum');
  let cursor = 4;
  function readNumber(max) {
    let value = 0;
    let place = 1;
    while (cursor < end) {
      const byte = patch[cursor++];
      value += (byte & 127) * place;
      if (value > max) break;
      if (byte & 128) return value;
      place *= 128;
      value += place;
      if (value > max) break;
    }
    throw new Error('bounds');
  }
  function readOffset() {
    const value = readNumber(maxRomBytes * 2 + 1);
    return (value % 2 ? -1 : 1) * Math.floor(value / 2);
  }
  const sourceSize = readNumber(maxRomBytes);
  const targetSize = readNumber(maxRomBytes);
  const metadataSize = readNumber(end - cursor);
  if (metadataSize > end - cursor) throw new Error('bounds');
  cursor += metadataSize;
  if (source.length !== sourceSize) throw new Error('sourceSize');
  if (crc32(source) !== footer.getUint32(0, true)) throw new Error('sourceChecksum');

  const target = new Uint8Array(targetSize);
  let output = 0;
  let sourceCopy = 0;
  let targetCopy = 0;
  while (cursor < end && output < target.length) {
    const command = readNumber((target.length - output) * 4 - 1);
    const length = Math.floor(command / 4) + 1;
    switch (command % 4) {
      case 0:
        if (output + length > source.length) throw new Error('bounds');
        target.set(source.subarray(output, output + length), output);
        break;
      case 1:
        if (cursor + length > end) throw new Error('bounds');
        target.set(patch.subarray(cursor, cursor + length), output);
        cursor += length;
        break;
      case 2:
        sourceCopy += readOffset();
        if (sourceCopy < 0 || sourceCopy + length > source.length) throw new Error('bounds');
        target.set(source.subarray(sourceCopy, sourceCopy + length), output);
        sourceCopy += length;
        break;
      case 3:
        targetCopy += readOffset();
        if (targetCopy < 0 || targetCopy >= output) throw new Error('bounds');
        // Forward copying is required when the source overlaps the bytes being written.
        for (let i = 0; i < length; i++) target[output + i] = target[targetCopy++];
        break;
    }
    output += length;
  }
  if (cursor !== end || output !== target.length) throw new Error('bounds');
  if (crc32(target) !== footer.getUint32(4, true)) throw new Error('targetChecksum');
  return target;
}

self.onmessage = async ({data: {rom, patch}}) => {
  try {
    if (rom.size > maxRomBytes || patch.size > maxRomBytes) throw new Error('large');
    const patchBytes = new Uint8Array(await patch.arrayBuffer());
    const source = new Uint8Array(await rom.arrayBuffer());
    const target = applyBps(source, patchBytes);
    self.postMessage({buffer: target.buffer}, [target.buffer]);
  } catch (error) {
    self.postMessage({error: error.message});
  }
};
</script>
<script>
'use strict';
const zh = /^zh(?:-|$)/i.test(navigator.language);
const labels = zh ? {
  heading: 'BPS 补丁器', 'drop-hint': '把 ROM 和 BPS 补丁拖到这里',
  'rom-label': '原版 ROM（.nds）', 'patch-label': '补丁（.bps）',
  'choose-rom': '选择文件', 'choose-patch': '选择文件',
  apply: '应用补丁', download: '下载 ROM', note: 'DraStic r1 需要未修改的 USA Rev 0 ROM。文件全程在本机处理。'
} : {};
const messages = zh ? {
  ready: '文件已就绪。', working: '正在校验并应用补丁…', success: '校验通过，可以下载。',
  selection: '请选择一个 .nds 文件和一个 .bps 文件。', format: '文件格式无效，请使用 BPS 补丁。',
  patchChecksum: '补丁校验失败，请重新下载补丁。', sourceSize: 'ROM 大小与补丁要求不符。',
  sourceChecksum: 'ROM 校验失败，请检查是否为补丁要求的原始版本。',
  bounds: '补丁数据不完整或超出范围。', targetChecksum: '生成的 ROM 校验失败。',
  large: '此工具支持最大 512 MiB 的文件。', failure: '处理失败，请重新打开文件后重试。'
} : {
  ready: 'Files are ready.', working: 'Checking files and applying patch…', success: 'Verified and ready to download.',
  selection: 'Select one .nds file and one .bps file.', format: 'Invalid file format. Use a BPS patch.',
  patchChecksum: 'Patch checksum mismatch. Download the patch again.', sourceSize: 'The ROM size does not match the patch.',
  sourceChecksum: 'ROM checksum mismatch. Use the original version required by the patch.',
  bounds: 'The patch is truncated or contains out-of-range data.', targetChecksum: 'The patched ROM failed verification.',
  large: 'This tool supports files up to 512 MiB.', failure: 'Processing failed. Reopen the files and try again.'
};
const get = id => document.getElementById(id);
if (zh) document.documentElement.lang = 'zh';
for (const [id, label] of Object.entries(labels)) get(id).textContent = label;
const fields = {rom: get('rom'), patch: get('patch')};
const selected = {rom: null, patch: null};
const zone = get('drop-zone');
const apply = get('apply');
const download = get('download');
let busy = false;
let outputUrl;

function status(key, error = false) {
  get('status').textContent = messages[key] || (key ? messages.failure : '');
  get('status').classList.toggle('error', error);
}

function clearDownload() {
  if (outputUrl) URL.revokeObjectURL(outputUrl);
  outputUrl = undefined;
  download.hidden = true;
  download.removeAttribute('href');
}

function selectFiles(files, expected) {
  if (busy || !files.length) return;
  const additions = {};
  for (const file of files) {
    const kind = /\.nds$/i.test(file.name) ? 'rom' : /\.bps$/i.test(file.name) ? 'patch' : null;
    if (!kind || (expected && kind !== expected) || additions[kind]) {
      status('selection', true);
      return;
    }
    additions[kind] = file;
  }
  clearDownload();
  for (const [kind, file] of Object.entries(additions)) {
    selected[kind] = file;
    get(`${kind}-name`).textContent = file.name;
  }
  apply.disabled = !selected.rom || !selected.patch;
  status(apply.disabled ? '' : 'ready');
}

for (const [kind, input] of Object.entries(fields)) {
  input.addEventListener('change', () => {
    selectFiles(input.files, kind);
    input.value = '';
  });
}
window.addEventListener('dragover', event => event.preventDefault());
window.addEventListener('drop', event => event.preventDefault());
zone.addEventListener('dragover', () => zone.classList.toggle('active', !busy));
zone.addEventListener('dragleave', event => {
  if (!zone.contains(event.relatedTarget)) zone.classList.remove('active');
});
zone.addEventListener('drop', event => {
  event.preventDefault();
  zone.classList.remove('active');
  selectFiles(event.dataTransfer.files);
});

apply.addEventListener('click', async () => {
  if (busy || !selected.rom || !selected.patch) return;
  busy = true;
  apply.disabled = true;
  for (const field of Object.values(fields)) field.disabled = true;
  clearDownload();
  status('working');
  let workerUrl;
  let worker;
  try {
    workerUrl = URL.createObjectURL(new Blob([get('patch-worker').textContent], {type: 'text/javascript'}));
    worker = new Worker(workerUrl);
    const data = await new Promise((resolve, reject) => {
      worker.onmessage = event => resolve(event.data);
      worker.onerror = () => reject(new Error('failure'));
      worker.onmessageerror = () => reject(new Error('failure'));
      worker.postMessage(selected);
    });
    if (data.error) throw new Error(data.error);
    outputUrl = URL.createObjectURL(new Blob([data.buffer], {type: 'application/octet-stream'}));
    download.href = outputUrl;
    download.download = selected.rom.name.replace(/\.nds$/i, '') + '-patched.nds';
    download.hidden = false;
    status('success');
  } catch (error) {
    status(error.message, true);
  } finally {
    if (worker) worker.terminate();
    if (workerUrl) URL.revokeObjectURL(workerUrl);
    busy = false;
    for (const field of Object.values(fields)) field.disabled = false;
    apply.disabled = false;
  }
});
</script>
</body>
</html>
